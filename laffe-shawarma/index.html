<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      // Apply the saved language before first paint (no flash of the wrong direction).
      try {
        var l = localStorage.getItem('laffet.lang')
        if (l === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl' }
        if (sessionStorage.getItem('laffet.splash')) document.documentElement.classList.add('no-splash')
      } catch (e) {}
    </script>
    <title>Laffet Shawarma — Shawarma in Hamra, Beirut</title>
    <meta
      name="description"
      content="Chicken and lamb shawarma, kebbeh, tawook, hummus and fries on Hamra main street, Beirut. Order for pickup or delivery."
    />
    <meta name="theme-color" content="#1d1715" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="restaurant" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_LB" />
    <meta property="og:site_name" content="Laffet Shawarma | لفّة شاورما" />
    <meta property="og:title" content="Laffet Shawarma — Hamra, Beirut" />
    <meta property="og:description" content="Shawarma wraps, meals and plates on Hamra main street. Order for pickup or delivery." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Laffet Shawarma",
        "alternateName": "لفّة شاورما",
        "servesCuisine": ["Lebanese", "Shawarma"],
        "telephone": "+96170111330",
        "image": "/og-image.jpg",
        "logo": "/icon-512.png",
        "sameAs": ["https://www.instagram.com/laffetshawarma/"],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Hamra Main Street, facing Spinneys",
          "addressLocality": "Beirut",
          "addressCountry": "LB"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
            "opens": "12:00",
            "closes": "00:00"
          }
        ],
        "hasMenu": "/menu"
      }
    </script>

    <style>
      /* Splash — inline so it paints instantly, before the app bundle loads. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #f7f1e7;
        transition: opacity 0.45s ease, visibility 0.45s;
      }
      #splash.is-leaving { opacity: 0; visibility: hidden; }
      #splash .splash__logo {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        box-shadow: 0 18px 40px -12px rgba(29, 23, 21, 0.3);
        animation: splash-in 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      #splash .splash__ring {
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 2px solid rgba(242, 170, 31, 0.8);
        animation: splash-ring 1.1s 0.25s ease-out both;
      }
      @keyframes splash-in { from { opacity: 0; transform: scale(0.86) rotate(-6deg); } to { opacity: 1; transform: none; } }
      @keyframes splash-ring { from { opacity: 0.9; transform: scale(1); } to { opacity: 0; transform: scale(1.7); } }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash__logo { animation: none; }
        #splash .splash__ring { display: none; }
      }
      html.no-splash #splash { display: none; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <span class="splash__ring"></span>
      <img class="splash__logo" src="/logo-badge.webp" alt="" width="140" height="140" />
    </div>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: sans-serif">
        Laffet Shawarma — Hamra main street, facing Spinneys, Beirut · +961 70 111 330 · Instagram @laffetshawarma
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
