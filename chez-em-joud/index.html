    <script>
      // Before first paint: enable JS-only styling and skip the intro on repeat visits.
      ;(function () {
        var root = document.documentElement
        root.classList.add('js')
        try {
          if (sessionStorage.getItem('cej:splash-seen') || matchMedia('(prefers-reduced-motion: reduce)').matches) {
            root.classList.add('no-splash')
          }
        } catch (e) {
          root.classList.add('no-splash')
        }
      })()
    </script>
