<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Streets Coffee Shop — Where Everyone Meets | Bhannine, Minieh</title>
    <meta name="description" content="Streets is the neighbourhood coffee shop on the Minieh highway in Bhannine. Coffee, smoothies, bubble tea, shakes, crepes and desserts — order for dine-in, pickup or delivery." />
    <meta name="theme-color" content="#141210" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Streets Coffee Shop" />
    <meta property="og:title" content="Streets Coffee Shop — Where Everyone Meets" />
    <meta property="og:description" content="The cosiest neighbourhood coffee shop in the city. Bhannine, Minieh highway — order for dine-in, pickup or delivery." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_LB" />
    <meta name="twitter:card" content="summary_large_image" />


    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CafeOrCoffeeShop",
        "name": "Streets Coffee Shop",
        "alternateName": "Streets cafe",
        "slogan": "Where Everyone Meets",
        "description": "The cosiest neighbourhood coffee shop in the city.",
        "image": "/img/brand/logo-badge.png",
        "logo": "/img/brand/logo-badge.png",
        "telephone": "+96170365358",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Minieh highway, in front of Naboulsi resto-cafe",
          "addressLocality": "Bhannine",
          "addressRegion": "North Lebanon",
          "addressCountry": "LB"
        },
        "servesCuisine": ["Coffee", "Smoothies", "Bubble tea", "Crepes", "Desserts"],
        "currenciesAccepted": "LBP",
        "hasMenu": "/menu",
        "acceptsReservations": false,
        "sameAs": ["https://www.instagram.com/streets.coffee.shop/"]
      }
    </script>

    <script>
      // Apply the saved language before first paint (no LTR→RTL flash) and decide whether to show the splash.
      (function () {
        try {
          var lang = JSON.parse(localStorage.getItem('streets:lang') || 'null')
          if (lang === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl' }
          if (sessionStorage.getItem('streets:splash')) document.documentElement.classList.add('no-splash')
          sessionStorage.setItem('streets:splash', '1')
        } catch (e) {}
        if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('no-splash')
        // the hero image is only on the homepage — preload it there and nowhere else
        if (location.pathname === '/') {
          var l = document.createElement('link'); l.rel = 'preload'; l.as = 'image'; l.href = '/img/float/streets-smoothie.webp'
          document.head.appendChild(l)
        }
      })()
    </script>

    <style>
      /* Splash — inline so it paints instantly, before the app bundle arrives. */
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
        background: #141210; transition: opacity .45s ease, visibility .45s;
      }
      .no-splash #splash { display: none; }
      #splash.splash--out { opacity: 0; visibility: hidden; }
      .splash__logo {
        width: min(46vw, 230px); height: auto;
        clip-path: inset(0 100% 0 0); transform: scale(.94);
        animation: splash-draw .75s cubic-bezier(.65, 0, .35, 1) .1s forwards, splash-settle 1s cubic-bezier(.2, .7, .2, 1) .1s forwards;
      }
      [dir='rtl'] .splash__logo { clip-path: inset(0 0 0 100%); }
      .splash__line {
        position: absolute; left: 50%; bottom: calc(50% - min(23vw, 115px) - 34px);
        width: 46px; height: 2px; margin-left: -23px; background: #f6b313;
        transform: scaleX(0); animation: splash-line .5s ease .55s forwards;
      }
      @keyframes splash-draw { to { clip-path: inset(0 0 0 0); } }
      @keyframes splash-settle { to { transform: none; } }
      @keyframes splash-line { to { transform: scaleX(1); } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img class="splash__logo" src="/img/brand/logo-mark-white.png" width="411" height="319" alt="" />
      <span class="splash__line"></span>
    </div>
    <script>document.getElementById('splash') && (document.getElementById('splash').dataset.start = performance.now())</script>

    <div id="root"></div>
    <noscript>
      <h1>Streets Coffee Shop — Where Everyone Meets</h1>
      <p>The cosiest neighbourhood coffee shop in the city. Bhannine, Minieh highway, in front of Naboulsi resto-cafe.</p>
      <p>WhatsApp / phone: <a href="https://wa.me/96170365358">+961 70 365 358</a> · Instagram: <a href="https://www.instagram.com/streets.coffee.shop/">@streets.coffee.shop</a></p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
