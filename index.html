        "openingHoursSpecification": [
          {

            "opens": "12:00",
            "closes": "22:00"
          },
          {

            "dayOfWeek": "Sunday",

          }

    <script>
      // Apply saved language before first paint (no flash of the wrong direction),
      // and only play the splash once per visit.
      (function () {
        var root = document.documentElement;
        try {
          var lang = localStorage.getItem('lk.lang');
          if (!lang && (navigator.language || '').toLowerCase().indexOf('ar') === 0) lang = 'ar';
          if (lang === 'ar') { root.lang = 'ar'; root.dir = 'rtl'; }
          if (sessionStorage.getItem('lk.splash')) root.classList.add('no-splash');
          sessionStorage.setItem('lk.splash', '1');
        } catch (e) {}
        var start = Date.now();
        window.__hideSplash = function () {
          var el = document.getElementById('splash');
          if (!el) return;
          var wait = Math.max(0, 1150 - (Date.now() - start));
          setTimeout(function () {
            el.classList.add('is-leaving');
            setTimeout(function () { el.remove(); }, 520);
          }, root.classList.contains('no-splash') ? 0 : wait);
        };
      })();
    </script>
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 1000;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #f3f5f1;
        transition: opacity .5s cubic-bezier(.22,.61,.36,1), visibility .5s;
        /* Safety net if scripts fail to load */
        animation: splash-failsafe .4s 4s forwards;
      }
      .no-splash #splash { display: none; }
      #splash.is-leaving { opacity: 0; visibility: hidden; }
      #splash.is-leaving .splash__inner { transform: scale(.97) translateY(-6px); }
      .splash__inner { display: flex; flex-direction: column; align-items: center; gap: 18px; transition: transform .5s cubic-bezier(.22,.61,.36,1); }
      .splash__mark { width: 92px; height: auto; opacity: 0; transform: translateY(10px) scale(.92); animation: splash-in .8s cubic-bezier(.16,1,.3,1) .05s forwards; transform-origin: 50% 90%; }
      .splash__word { width: 190px; height: auto; opacity: 0; animation: splash-fade .7s ease .35s forwards; }
      .splash__line { width: 0; height: 1px; background: #9c7a70; animation: splash-line .6s cubic-bezier(.22,.61,.36,1) .55s forwards; }
      @keyframes splash-in { to { opacity: 1; transform: none; } }
      @keyframes splash-fade { to { opacity: 1; } }
      @keyframes splash-line { to { width: 56px; } }
      @keyframes splash-failsafe { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        .splash__mark, .splash__word { animation: none; opacity: 1; transform: none; }
        .splash__line { animation: none; width: 56px; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash__inner">
        <img class="splash__mark" src="/favicon.svg" alt="" width="92" height="99" />
        <img class="splash__word" src="/images/wordmark.svg" alt="" width="190" height="28" />
        <span class="splash__line"></span>
      </div>
    </div>
