    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Adam's Burger",
        "alternateName": "adamsburgerlb",
        "slogan": "Happiness starts here",
        "description": "Fast food restaurant in Saida, beside LIU.",
        "image": "%BASE_URL%img/brand/logo-badge.png",
        "logo": "%BASE_URL%img/brand/logo-badge.png",
        "telephone": "+96181501258",
        "email": "adamburgerlb@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Beside LIU",
          "addressLocality": "Saida",
          "addressRegion": "South Lebanon",
          "addressCountry": "LB"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Saturday", "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday"],
            "opens": "13:00",
            "closes": "22:00"
          }
        ],
        "servesCuisine": ["Burgers", "Fast food"],
        "currenciesAccepted": "USD",
        "hasMenu": "/menu",
        "acceptsReservations": false,
        "sameAs": ["https://www.instagram.com/adamsburgerlb/"]
      }
    </script>

    <script>
      // Apply the saved language before first paint (no LTR→RTL flash) and decide whether to show the splash.
      (function () {
        try {
          var lang = JSON.parse(localStorage.getItem('adams:lang') || 'null')
          if (lang === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl' }
          if (sessionStorage.getItem('adams:splash')) document.documentElement.classList.add('no-splash')
          sessionStorage.setItem('adams:splash', '1')
        } catch (e) {}
        if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('no-splash')
        // the hero image is only on the homepage — preload it there and nowhere else
        if (location.pathname === '%BASE_URL%' || '%BASE_URL%' === './') {
          var l = document.createElement('link'); l.rel = 'preload'; l.as = 'image'; l.href = '%BASE_URL%img/float/adams-burger.webp'
          document.head.appendChild(l)
        }
      })()
    </script>

    <style>
      /* Splash — inline so it paints instantly, before the app bundle arrives. */
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
        background: #121010; transition: opacity .45s ease, visibility .45s;
      }
      .no-splash #splash { display: none; }
      #splash.splash--out { opacity: 0; visibility: hidden; }
      .splash__logo {
        width: min(46vw, 230px); height: auto;
        clip-path: inset(0 100% 0 0); transform: scale(.94);
        animation: splash-draw .75s cubic-bezier(.65, 0, .35, 1) .1s forwards, splash-settle 1s cubic-bezier(.2, .7, .2, 1) .1s forwards;
      }
      [dir='rtl'] .splash__logo { clip-path: inset(0 0 0 100%); }
      .splash__line {
        position: absolute; left: 50%; bottom: calc(50% - min(23vw, 115px) - 34px);
        width: 46px; height: 2px; margin-left: -23px; background: #d71f26;
        transform: scaleX(0); animation: splash-line .5s ease .55s forwards;
      }
      @keyframes splash-draw { to { clip-path: inset(0 0 0 0); } }
      @keyframes splash-settle { to { transform: none; } }
      @keyframes splash-line { to { transform: scaleX(1); } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img class="splash__logo" src="%BASE_URL%img/brand/logo-badge.png" width="384" height="384" alt="" />
      <span class="splash__line"></span>
    </div>
    <script>document.getElementById('splash') && (document.getElementById('splash').dataset.start = performance.now())</script>

    <div id="root"></div>

    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
