<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chippy Restaurant | Shrimp, Fish &amp; Chicken in Hleliyeh, Saida</title>
    <meta
      name="description"
      content="Chippy Restaurant in Hleliyeh, facing Queen Station, Saida. Jumbo shrimp, fish and Chippy Chicken boxes, sandwiches and mongo bowls. Order online for pickup or delivery: 78 703 770."
    />
    <meta name="theme-color" content="#f6efe2" />
    <link rel="canonical" href="https://chippy-restaurant.netlify.app/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/logo.svg" as="image" type="image/svg+xml" />

    <meta property="og:type" content="restaurant.restaurant" />
    <meta property="og:site_name" content="Chippy Restaurant" />
    <meta property="og:title" content="Chippy Restaurant | A Taste To Remember" />
    <meta
      property="og:description"
      content="Shrimp, fish and crispy chicken in Hleliyeh, Saida. Order online for pickup or delivery."
    />
    <meta property="og:url" content="https://chippy-restaurant.netlify.app/" />
    <meta property="og:image" content="https://chippy-restaurant.netlify.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Chippy shrimp box with fries and sauces" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Chippy Restaurant",
        "slogan": "A Taste To Remember",
        "url": "https://chippy-restaurant.netlify.app/",
        "logo": "https://chippy-restaurant.netlify.app/logo.svg",
        "image": "https://chippy-restaurant.netlify.app/og-image.jpg",
        "telephone": "+96178703770",
        "email": "chippy.restaurant@outlook.com",
        "servesCuisine": ["Seafood", "Fried chicken", "Sandwiches"],
        "priceRange": "$",
        "currenciesAccepted": "USD",
        "paymentAccepted": "Cash, Whish Money",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Hleliyeh, facing Queen Station",
          "addressLocality": "Saida",
          "addressCountry": "LB"
        },
        "hasMenu": "https://chippy-restaurant.netlify.app/#menu",
        "acceptsReservations": false,
        "sameAs": ["https://www.instagram.com/chippyrestaurant/"]
      }
    </script>

    <script>
      // Show the splash once per visit, and never for reduced-motion users.
      try {
        var d = document.documentElement
        if (sessionStorage.getItem('chippy:splash') || matchMedia('(prefers-reduced-motion: reduce)').matches) {
          d.classList.add('no-splash')
        } else {
          sessionStorage.setItem('chippy:splash', '1')
        }
      } catch (e) {
        document.documentElement.classList.add('no-splash')
      }
    </script>
    <style>
      .splash{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#f6efe2;
        animation:splash-out .45s cubic-bezier(.7,0,.3,1) 1.15s forwards}
      .splash__mark{width:min(64vw,300px);display:grid;justify-items:center;gap:18px}
      .splash__mark img{width:100%;height:auto;opacity:0;transform:translateY(14px) scale(.96);
        animation:splash-in .7s cubic-bezier(.2,.7,.2,1) .1s forwards}
      .splash__line{height:3px;width:56%;background:#e9792a;border-radius:3px;transform:scaleX(0);
        animation:splash-line .55s cubic-bezier(.6,0,.2,1) .45s forwards}
      .no-splash .splash{display:none}
      @keyframes splash-in{to{opacity:1;transform:none}}
      @keyframes splash-line{to{transform:scaleX(1)}}
      @keyframes splash-out{to{opacity:0;visibility:hidden;transform:translateY(-2%)}}
    </style>
  </head>
  <body>
    <div class="splash" aria-hidden="true">
      <div class="splash__mark">
        <img src="/logo.svg" alt="" width="393" height="204" />
        <span class="splash__line"></span>
      </div>
    </div>
    <div id="root"><!--app-html--></div>
    <noscript>
      <p style="padding:16px;text-align:center">Online ordering needs JavaScript. You can still order by phone or WhatsApp on 78 703 770.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
