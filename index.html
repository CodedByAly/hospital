    <script type="application/ld+json">

    <script>
      // Restore language before first paint, and decide whether to show the splash.
      (function () {
        var d = document.documentElement;
        try {
          if (localStorage.getItem('osnack.lang') === 'ar') {
            d.lang = 'ar';
            d.dir = 'rtl';
          }
        } catch (e) {}
        var seen = false;
        try {
          seen = sessionStorage.getItem('osnack.splash') === '1';
          sessionStorage.setItem('osnack.splash', '1');
        } catch (e) {}
        if (seen) d.classList.add('no-splash');
        var start = Date.now();
        window.__hideSplash = function () {
          var el = document.getElementById('splash');
          if (!el) return;
          var wait = seen ? 0 : Math.max(0, 1150 - (Date.now() - start));
          setTimeout(function () {
            el.classList.add('is-done');
            setTimeout(function () {
              el.remove();
            }, 450);
          }, wait);
        };
        // Never let the splash block the page if the app fails to load.
        setTimeout(function () {
          window.__hideSplash();
        }, 4000);
      })();
    </script>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #000;
        transition: opacity 0.42s ease, visibility 0.42s;
      }
      .no-splash #splash { display: none; }
      #splash.is-done { opacity: 0; visibility: hidden; }
      .splash__mark {
        width: min(46vw, 220px);
        height: auto;
        animation: splash-in 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .splash__line {
        display: block;
        width: 56px;
        height: 2px;
        margin: 18px auto 0;
        background: #d62a2a;
        transform-origin: center;
        animation: splash-line 0.6s 0.35s cubic-bezier(0.6, 0, 0.2, 1) both;
      }
      @keyframes splash-in {
        from { opacity: 0; transform: scale(0.94); }
        to { opacity: 1; transform: none; }
      }
      @keyframes splash-line {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash__mark, .splash__line { animation: none; }
      }
    </style>
  </head>
  <body>

        <span class="splash__line"></span>
