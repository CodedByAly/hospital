    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Outlaw Sushi Bar",
        "servesCuisine": ["Sushi", "Japanese"],
        "image": "%BASE_URL%img/brand/logo.png",
        "telephone": ["+96178997164", "+96178944899"],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Mansourieh main road, facing the municipality",
          "addressLocality": "Mansourieh",
          "addressRegion": "Mount Lebanon",
          "addressCountry": "LB"
        },
        "currenciesAccepted": "USD",
        "hasMenu": "/menu",
        "sameAs": ["https://www.instagram.com/outlawsushibar/"]
      }
    </script>
    <script>
      // Show the intro once per visit, never for reduced motion.
      try {
        if (sessionStorage.getItem('outlaw:intro') || matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('no-splash')
        sessionStorage.setItem('outlaw:intro', '1')
      } catch (e) {}
    </script>
    <style>
      html, body { background: #0e0d0c; }
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #0e0d0c; transition: opacity .5s ease, visibility .5s; }
      .no-splash #splash { display: none; }
      #splash.splash--out { opacity: 0; visibility: hidden; }
      .splash__mark { position: relative; width: min(40vw, 190px); aspect-ratio: 1; }
      .splash__mark img { width: 100%; height: 100%; animation: splash-in .9s cubic-bezier(.16,1,.3,1) both; }
      .splash__mark::before, .splash__mark::after { content: ''; position: absolute; left: 50%; top: -18%; width: 3px; height: 136%; margin-left: -1.5px; background: #efe9df; transform-origin: 50% 30%; animation: splash-stick .7s cubic-bezier(.65,0,.35,1) both; }
      .splash__mark::before { rotate: 32deg; }
      .splash__mark::after { rotate: -32deg; animation-delay: .08s; }
      @keyframes splash-in { from { transform: scale(.85) rotate(-20deg); opacity: 0; } }
      @keyframes splash-stick { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><div class="splash__mark"><img src="%BASE_URL%img/brand/logo.png" alt="" width="190" height="190" /></div></div>
    <script>document.getElementById('splash') && (document.getElementById('splash').dataset.start = performance.now())</script>

    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
