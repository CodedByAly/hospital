      name="description"
      content="Khalifa Bites in Saida: charcoal-grilled burgers, crispy chicken, subs, hot dogs and shawarma. Order for pickup or delivery on 76 086 068."
    />
    <meta name="theme-color" content="#0137D5" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="restaurant.restaurant" />
    <meta property="og:site_name" content="Khalifa Bites" />
    <meta property="og:title" content="Khalifa Bites | Burgers, Subs &amp; Shawarma in Saida" />
    <meta property="og:description" content="The Original Lebanese Flavor — burgers, crispy chicken, subs and shawarma in Saida. Pickup or delivery." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Khalifa Bites",
        "slogan": "The Original Lebanese Flavor",
        "description": "Burgers, crispy chicken, subs, hot dogs and shawarma in Saida. Pickup and delivery.",
        "servesCuisine": ["Burgers", "Sandwiches", "Shawarma", "Lebanese"],
        "telephone": "+96176086068",
        "image": "/og-image.jpg",
        "logo": "/images/logo.svg",
        "currenciesAccepted": "USD",
        "acceptsReservations": false,
        "hasMenu": "/menu",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Saida",
          "addressCountry": "LB"
        },
        "sameAs": ["https://www.instagram.com/khalifa.bites/"]
      }
    </script>

    <style>
      /* Splash — inlined so it paints before the app's CSS and JS arrive. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 80% at 50% 35%, #1b55f0 0%, #0137d5 55%, #0128a3 100%);
        transition: clip-path 0.8s cubic-bezier(0.76, 0, 0.24, 1);
        clip-path: inset(0 0 0 0);
      }
      #splash .splash__logo {
        position: relative;
        width: min(70vw, 360px);
        aspect-ratio: 240.27 / 81.62;
        transition: transform 0.8s cubic-bezier(0.76, 0, 0.24, 1), opacity 0.4s ease;
      }
      #splash img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #splash .splash__word {
        clip-path: inset(0 100% 0 0);
        animation: splash-wipe 0.75s cubic-bezier(0.65, 0, 0.35, 1) 0.1s forwards;
      }
      #splash .splash__flag {
        opacity: 0;
        transform: translateY(-40%) rotate(-25deg);
        transform-origin: 66% 18%;
        animation: splash-drop 0.6s cubic-bezier(0.34, 1.45, 0.6, 1) 0.7s forwards;
      }
      #splash.is-leaving {
        clip-path: inset(0 0 100% 0);
      }
      #splash.is-leaving .splash__logo {
        transform: translateY(-30px);
        opacity: 0;
      }
      @keyframes splash-wipe {
        to {
          clip-path: inset(0 0 0 0);
        }
      }
      @keyframes splash-drop {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash__word,
        #splash .splash__flag {
          animation: none;
          clip-path: none;
          opacity: 1;
          transform: none;
        }
        #splash {
          transition: opacity 0.3s ease;
        }
        #splash.is-leaving {
          clip-path: none;
          opacity: 0;
        }
      }
      html.has-splash body {
        overflow: hidden;
      }
    </style>
    <script>
      (function () {
        var root = document.documentElement;
        var seen = false;
        try {
          seen = sessionStorage.getItem('khalifa.splash') === '1';
          sessionStorage.setItem('khalifa.splash', '1');
        } catch (e) {}
        root.setAttribute('data-splash', seen ? 'off' : 'on');
        if (!seen) root.classList.add('has-splash');
      })();
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash__logo">
        <img class="splash__word" src="/images/logo-white-word.svg" alt="" />
        <img class="splash__flag" src="/images/logo-flag.svg" alt="" />
      </div>
    </div>
    <script>
      (function () {
        var s = document.getElementById('splash');
        if (document.documentElement.getAttribute('data-splash') === 'off') s.remove();
        else s.dataset.start = String(performance.now());
      })();
    </script>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">Khalifa Bites — Saida, Lebanon. Order: 76 086 068. Instagram: @khalifa.bites</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
