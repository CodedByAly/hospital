<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Burger Bar | Burgers, Sandwiches &amp; Grills in West Bekaa</title>

    <meta name="theme-color" content="#0a0a0a" />
    <link rel="canonical" href="https://burger-bar-alpha.vercel.app/" />
    <link rel="icon" href="/icons/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="restaurant.restaurant" />
    <meta property="og:site_name" content="Burger Bar" />
    <meta property="og:title" content="Burger Bar | Taste beyond ordinary" />
    <meta property="og:description" content="Burgers, sandwiches and grills on Al-Manara main road, West Bekaa. Dine-in, delivery and takeaway." />
    <meta property="og:url" content="https://burger-bar-alpha.vercel.app/" />
    <meta property="og:image" content="https://burger-bar-alpha.vercel.app/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--structured-data-->

    <style>
      /* Splash: painted from HTML so it shows instantly; removed when its animation ends. */
      #splash { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #0a0a0a; animation: splash-out .5s cubic-bezier(.7,0,.3,1) 1.25s forwards; }
      #splash img { width: min(46vw, 220px); height: auto; animation: splash-in .8s cubic-bezier(.2,.8,.2,1) .05s both; }
      #splash::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: #ffd200; transform-origin: left; animation: splash-bar 1.1s cubic-bezier(.6,0,.3,1) .1s both; }
      @keyframes splash-in { from { opacity: 0; transform: scale(.6) rotate(-25deg); } }
      @keyframes splash-bar { from { transform: scaleX(0); } }
      @keyframes splash-out { to { clip-path: inset(0 0 100% 0); visibility: hidden; } }
      .no-splash #splash { display: none; }
      @media (prefers-reduced-motion: reduce) {
        #splash { animation: splash-fade .3s linear .6s forwards; }
        #splash img, #splash::after { animation: none; }
        @keyframes splash-fade { to { opacity: 0; visibility: hidden; } }
      }
    </style>
    <script>
      // Show the splash once per visit, not on every page load.
      try {
        if (sessionStorage.getItem('burgerbar.splash')) document.documentElement.classList.add('no-splash');
        else sessionStorage.setItem('burgerbar.splash', '1');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><img src="/icons/logo-256.png" alt="" width="256" height="256" /></div>
    <script>
      (function () {
        var s = document.getElementById('splash');
        if (!s) return;
        if (document.documentElement.classList.contains('no-splash')) { s.remove(); return; }
        s.addEventListener('animationend', function (e) { if (e.target === s) s.remove(); });
        setTimeout(function () { if (s.isConnected) s.remove(); }, 2600);
      })();
    </script>
    <div id="root"></div>
    <noscript>
      <p style="padding:24px;font-family:sans-serif">Burger Bar, Al-Manara main road, West Bekaa. Call +961 76 799 767. Please enable JavaScript to order online.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
