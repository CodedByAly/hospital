<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Grillz | Burger. Done right.</title>
    <meta name="description" content="Grillz: Angus beef and crispy chicken burgers, wraps and quesadillas near Beirut Arab University. Open daily 12 PM – 1 AM. Delivery on 79 022 617." />
    <meta name="theme-color" content="#0e0d0c" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="restaurant.restaurant" />
    <meta property="og:site_name" content="Grillz" />
    <meta property="og:title" content="Grillz | Burger. Done right." />
    <meta property="og:description" content="Premium burgers & wraps near Beirut Arab University. Open daily 12 PM – 1 AM. Delivery: 79 022 617." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Grillz",
        "slogan": "Burger. Done right.",
        "description": "Premium burgers & wraps near Beirut Arab University, Lebanon. Pickup and delivery.",
        "servesCuisine": ["Burgers", "Wraps"],
        "telephone": "+96179022617",
        "image": "/og-image.jpg",
        "logo": "/images/logo.svg",
        "currenciesAccepted": "LBP, USD",
        "acceptsReservations": false,
        "hasMenu": "/menu",
        "hasMap": "https://maps.app.goo.gl/au39wz7aYV7w9aHa6",
        "address": { "@type": "PostalAddress", "addressCountry": "LB", "streetAddress": "Near Beirut Arab University" },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
            "opens": "12:00",
            "closes": "01:00"
          }
        ],
        "sameAs": ["https://www.instagram.com/grillz.burger.lb/"]
      }
    </script>

    <style>
      /* Splash — inlined so it paints before the app's CSS and JS arrive. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: radial-gradient(60% 50% at 50% 55%, #2a1608 0%, #0e0d0c 70%);
        transition: opacity 0.6s ease, transform 0.8s cubic-bezier(0.76, 0, 0.24, 1);
      }
      #splash .splash__logo {
        width: min(64vw, 300px);
        aspect-ratio: 284 / 244;
        background: url('/images/logo.svg') center / contain no-repeat;
        clip-path: inset(100% 0 0 0);
        animation: splash-rise 0.95s cubic-bezier(0.3, 0.8, 0.3, 1) 0.1s forwards;
        filter: drop-shadow(0 0 0 rgba(240, 124, 34, 0));
      }
      #splash .splash__glow {
        position: absolute;
        width: min(80vw, 420px);
        aspect-ratio: 1;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(240, 124, 34, 0.35), transparent);
        opacity: 0;
        animation: splash-glow 1.2s ease 0.35s forwards;
      }
      #splash.is-leaving {
        opacity: 0;
        transform: scale(1.06);
      }
      @keyframes splash-rise {
        to {
          clip-path: inset(0 0 0 0);
        }
      }
      @keyframes splash-glow {
        50% {
          opacity: 1;
        }
        to {
          opacity: 0.6;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash__logo,
        #splash .splash__glow {
          animation: none;
          clip-path: none;
          opacity: 1;
        }
      }
      html.has-splash body {
        overflow: hidden;
      }
    </style>
    <script>
      (function () {
        var root = document.documentElement;
        var seen = false;
        try {
          seen = sessionStorage.getItem('grillz.splash') === '1';
          sessionStorage.setItem('grillz.splash', '1');
        } catch (e) {}
        root.setAttribute('data-splash', seen ? 'off' : 'on');
        if (!seen) root.classList.add('has-splash');
      })();
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <span class="splash__glow"></span>
      <span class="splash__logo"></span>
    </div>
    <script>
      (function () {
        var s = document.getElementById('splash');
        if (document.documentElement.getAttribute('data-splash') === 'off') s.remove();
        else s.dataset.start = String(performance.now());
      })();
    </script>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: sans-serif">Grillz — Burger. Done right. Near Beirut Arab University, Lebanon. Delivery: 79 022 617. Open daily 12 PM – 1 AM. Instagram: @grillz.burger.lb</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
